<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#09111c" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <meta
      name="description"
      content="MDS Mission-Directed Swarm dashboard for PX4/MAVLink fleet operations, SITL, drone shows, SAR, and cooperative autonomy."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.svg" or "favicon.svg", "%PUBLIC_URL%/favicon.svg" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>MDS - Mission-Directed Swarm</title>
    <script>
      (function () {
        try {
          var storageKey = 'drone-dashboard-theme';
          var storedTheme = localStorage.getItem(storageKey) || 'auto';
          var darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
          var lightQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
          var resolvedTheme = storedTheme;

          if (storedTheme === 'auto') {
            if (darkQuery && darkQuery.matches) {
              resolvedTheme = 'dark';
            } else if (lightQuery && lightQuery.matches) {
              resolvedTheme = 'light';
            } else {
              resolvedTheme = 'dark';
            }
          }

          var root = document.documentElement;
          root.classList.remove('theme-light', 'theme-dark');
          root.classList.add('theme-' + resolvedTheme);
          root.setAttribute('data-theme', resolvedTheme);
          root.style.colorScheme = resolvedTheme;
          root.style.backgroundColor = resolvedTheme === 'light' ? '#f8fbfd' : '#09111c';

          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute('content', resolvedTheme === 'light' ? '#f8fbfd' : '#09111c');
          }

          var colorSchemeMeta = document.querySelector('meta[name="color-scheme"]');
          if (colorSchemeMeta) {
            colorSchemeMeta.setAttribute('content', resolvedTheme === 'light' ? 'light' : 'dark');
          }
        } catch (error) {
          // Best-effort theme bootstrap only.
        }
      })();
    </script>
    <script>
      // React's error boundary starts after the deferred entry script has loaded.
      document.addEventListener('error', function (event) {
        var script = event.target;
        if (!(script instanceof HTMLScriptElement) || !script.defer || !script.src) return;
        function showRetry() {
          var boot = document.getElementById('mds-bootstrap');
          if (!boot) return;
          boot.querySelector('.app-loading__label').textContent = 'Dashboard couldn’t load';
          boot.querySelector('.app-loading__indicator').hidden = true;
          var retry = boot.querySelector('button');
          retry.hidden = false;
          retry.onclick = function () { window.location.reload(); };
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', showRetry, { once: true });
        } else {
          showRetry();
        }
      }, true);
    </script>
    <noscript><style>#mds-bootstrap { display: none; }</style></noscript>
  </head>
  <body>
    <noscript>Enable JavaScript to open MDS.</noscript>
    <div id="root">
      <div id="mds-bootstrap" class="app-loading app-loading--standalone" role="status">
        <img class="app-loading__mark" src="%PUBLIC_URL%/favicon.svg" width="56" height="56" alt="" />
        <span class="app-loading__label">Opening MDS…</span>
        <span class="app-loading__indicator" aria-hidden="true"></span>
        <button class="app-loading__retry" type="button" hidden>Retry</button>
      </div>
    </div>
  </body>
</html>
